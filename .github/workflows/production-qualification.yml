name: Production qualification

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Full 40-character Git SHA expected to be live
        required: true
        type: string
      run_managed_oauth_contract:
        description: Run the authenticated MCP contract with a short-lived Managed OAuth client token
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "43 3 * * *"

concurrency:
  group: production-qualification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-edge:
    name: Public OAuth/MCP edge canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPTR_DEPLOYED_MCP_URL: ${{ vars.CPTR_DEPLOYED_MCP_URL }}
      CPTR_DEPLOYED_PUBLIC_ORIGIN: ${{ vars.CPTR_DEPLOYED_PUBLIC_ORIGIN }}
      CPTR_EDGE_AUTH_MODE: ${{ vars.CPTR_EDGE_AUTH_MODE }}
      CPTR_EDGE_DCR_CLIENTS_JSON: ${{ vars.CPTR_EDGE_DCR_CLIENTS_JSON }}
      CPTR_EDGE_DCR_REDIRECT_URIS: ${{ vars.CPTR_EDGE_DCR_REDIRECT_URIS }}
      CPTR_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_release_sha || '' }}
      CPTR_EXPECTED_TOOL_SURFACE: compact
    steps:
      - name: Require production endpoint configuration
        run: |
          test -n "$CPTR_DEPLOYED_MCP_URL" || test -n "$CPTR_DEPLOYED_PUBLIC_ORIGIN"

      - name: Checkout verifier revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public edge through Cloudflare
        run: npm run check:public-edge

  authenticated-contract:
    name: Native OAuth authenticated MCP 2026 contract
    # Native mode reaches this origin verifier directly with the configured
    # operator bearer. Managed OAuth has a separate client-token job below and
    # must never be qualified by bypassing Cloudflare Access with an origin token.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.CPTR_EDGE_AUTH_MODE == 'native' }}
    needs: public-edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPTR_DEPLOYED_MCP_URL: ${{ vars.CPTR_DEPLOYED_MCP_URL }}
      CPTR_DEPLOYED_PUBLIC_ORIGIN: ${{ vars.CPTR_DEPLOYED_PUBLIC_ORIGIN }}
      CPTR_DEPLOYED_MCP_TOKEN: ${{ secrets.CPTR_DEPLOYED_MCP_TOKEN }}
      CPTR_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      CPTR_EXPECTED_TOOL_SURFACE: compact
    steps:
      - name: Require native-mode immutable release and bearer configuration
        run: |
          test -n "$CPTR_DEPLOYED_MCP_URL"
          test -n "$CPTR_DEPLOYED_MCP_TOKEN"
          printf '%s' "$CPTR_EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout expected release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed MCP 2026 contract and exact release SHA
        run: npm run check:deployed-contract

  managed-oauth-authenticated-contract:
    name: Managed OAuth authenticated MCP 2026 contract
    if: ${{ github.event_name == 'workflow_dispatch' && vars.CPTR_EDGE_AUTH_MODE == 'cloudflare-managed' && inputs.run_managed_oauth_contract }}
    needs: public-edge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPTR_DEPLOYED_MCP_URL: ${{ vars.CPTR_DEPLOYED_MCP_URL }}
      # This must be a short-lived access token obtained through the intended
      # Cloudflare Managed OAuth client flow. It is not an origin bypass token.
      CPTR_DEPLOYED_MCP_TOKEN: ${{ secrets.CPTR_MANAGED_OAUTH_ACCESS_TOKEN }}
      CPTR_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      CPTR_EXPECTED_TOOL_SURFACE: compact
    steps:
      - name: Require Managed OAuth acceptance credentials and immutable release
        run: |
          test -n "$CPTR_DEPLOYED_MCP_URL"
          test -n "$CPTR_DEPLOYED_MCP_TOKEN"
          printf '%s' "$CPTR_EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact release under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify authenticated MCP through Managed OAuth and exact release SHA
        run: npm run check:deployed-contract

      - name: Record authenticated Managed OAuth acceptance evidence
        if: ${{ success() }}
        run: |
          {
            echo '### Managed OAuth authenticated acceptance'
            echo
            echo "- release: \`$CPTR_EXPECTED_RELEASE_SHA\`"
            echo '- auth path: Cloudflare Managed OAuth client token'
            echo '- MCP contract: passed'
            echo '- expected tool surface: compact'
          } >> "$GITHUB_STEP_SUMMARY"

  manual-release-acceptance:
    name: Manual exact-SHA release acceptance
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs:
      - public-edge
      - authenticated-contract
      - managed-oauth-authenticated-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require public-edge qualification
        run: |
          test "${{ needs['public-edge'].result }}" = "success"

      - name: Require auth-mode-specific authenticated contract
        env:
          EDGE_AUTH_MODE: ${{ vars.CPTR_EDGE_AUTH_MODE }}
          RUN_MANAGED_OAUTH_CONTRACT: ${{ inputs.run_managed_oauth_contract }}
          NATIVE_CONTRACT_RESULT: ${{ needs['authenticated-contract'].result }}
          MANAGED_CONTRACT_RESULT: ${{ needs['managed-oauth-authenticated-contract'].result }}
        run: |
          case "$EDGE_AUTH_MODE" in
            native)
              test "$NATIVE_CONTRACT_RESULT" = "success"
              ;;
            cloudflare-managed)
              test "$RUN_MANAGED_OAUTH_CONTRACT" = "true"
              test "$MANAGED_CONTRACT_RESULT" = "success"
              ;;
            *)
              echo "Unsupported production edge auth mode: $EDGE_AUTH_MODE" >&2
              exit 1
              ;;
          esac

      - name: Record manual release acceptance
        run: |
          {
            echo '### Manual exact-SHA release acceptance'
            echo
            echo "- release: \`${{ inputs.expected_release_sha }}\`"
            echo "- edge auth mode: \`${{ vars.CPTR_EDGE_AUTH_MODE }}\`"
            echo '- public edge: passed'
            echo '- authenticated MCP contract: passed'
          } >> "$GITHUB_STEP_SUMMARY"
