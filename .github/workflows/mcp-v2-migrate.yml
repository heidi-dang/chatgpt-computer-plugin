name: MCP v2 migration bootstrap

on:
  push:
    branches:
      - fix/mcp-2026-07-28

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Apply official MCP v1 to v2 codemod
        run: npx -y @modelcontextprotocol/codemod@latest v1-to-v2 .
      - name: Refresh dependency lockfile
        run: npm install
      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/mcp-v2-migrate.yml
      - name: Commit migration output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: migrate MCP SDK to v2"
          git push origin HEAD
