name: CPTR MCP 2026 Gate

on:
  push:
    branches:
      - cptr/mcp-2026-oauth-fix

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main fix/mcp-2026-07-28
      - name: Merge official MCP v2 codemod output
        run: git merge --no-commit --no-ff origin/fix/mcp-2026-07-28
      - name: Upgrade Zod to MCP v2 floor
        run: npm install zod@^4.2.0
      - name: Apply bounded MCP 2026 bridge repair
        run: python3 .github/mcp2026_repair.py
      - name: Show migration footprint
        run: |
          git diff --stat HEAD
          printf 'codemod review markers: '
          grep -R -h --exclude-dir=node_modules --exclude-dir=.git '@mcp-codemod-error' server tests scripts 2>/dev/null | wc -l
      - name: Verify focused MCP 2026 and OAuth behavior
        run: npx tsx --test tests/mcp-2026-protocol.test.ts tests/oauth-2026.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Full test suite
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified migration
        run: |
          rm -f .github/workflows/cptr-mcp-2026-gate.yml .github/mcp2026_repair.py
          git add -A
          git commit -m 'fix: support MCP 2026-07-28 authorization'
          git merge-base --is-ancestor origin/main HEAD
      - name: Publish repair branch and fast-forward main
        run: |
          git push origin HEAD:cptr/mcp-2026-oauth-fix
          git push origin HEAD:main
