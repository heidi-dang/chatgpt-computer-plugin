name: CPTR MCP 2026 Gate

on:
  push:
    branches:
      - cptr/mcp-2026-oauth-fix

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Stage official MCP v2 codemod output
        run: git merge --no-commit --no-ff origin/fix/mcp-2026-07-28
      - name: Upgrade Zod to MCP v2 floor
        run: npm install zod@^4.2.0
      - name: Show staged migration footprint
        run: |
          git diff --stat HEAD
          printf 'codemod review markers: '
          grep -R -h --exclude-dir=node_modules --exclude-dir=.git '@mcp-codemod-error' server tests scripts 2>/dev/null | wc -l
      - name: Typecheck staged SDK v2 migration
        run: npm run typecheck
