name: Cloudflare Managed OAuth release acceptance (manual)

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Full 40-character plugin SHA running in production
        required: true
        type: string
      backend_release_sha:
        description: Exact backend SHA for this release tuple
        required: true
        type: string
      extension_release_sha:
        description: Exact extension SHA for this release tuple
        required: true
        type: string

concurrency:
  group: managed-oauth-release-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-edge:
    name: Public OAuth/MCP edge canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPTR_DEPLOYED_MCP_URL: ${{ vars.CPTR_DEPLOYED_MCP_URL }}
      CPTR_DEPLOYED_PUBLIC_ORIGIN: ${{ vars.CPTR_DEPLOYED_PUBLIC_ORIGIN }}
      CPTR_EDGE_AUTH_MODE: ${{ vars.CPTR_EDGE_AUTH_MODE }}
      CPTR_EDGE_DCR_CLIENTS_JSON: ${{ vars.CPTR_EDGE_DCR_CLIENTS_JSON }}
      CPTR_EDGE_DCR_REDIRECT_URIS: ${{ vars.CPTR_EDGE_DCR_REDIRECT_URIS }}
      CPTR_EXPECTED_RELEASE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_release_sha || '' }}
      CPTR_EXPECTED_TOOL_SURFACE: compact
    steps:
      - name: Require production endpoint configuration
        run: |
          test -n "$CPTR_DEPLOYED_MCP_URL" || test -n "$CPTR_DEPLOYED_PUBLIC_ORIGIN"

      - name: Checkout verifier revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify public edge through Cloudflare
        run: npm run check:public-edge

  release-guardian:
    name: Immutable cross-repo and session-recovery acceptance
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPECTED_PLUGIN_SHA: ${{ inputs.expected_release_sha }}
      EXPECTED_BACKEND_SHA: ${{ inputs.backend_release_sha }}
      EXPECTED_EXTENSION_SHA: ${{ inputs.extension_release_sha }}
    steps:
      - name: Require exact three-member release tuple
        run: |
          for sha in "$EXPECTED_PLUGIN_SHA" "$EXPECTED_BACKEND_SHA" "$EXPECTED_EXTENSION_SHA"; do
            printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          done

      - name: Checkout Guardian verifier from current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Checkout exact plugin release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_release_sha }}
          path: release/plugin

      - name: Checkout exact backend release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: heidi-dang/computer
          ref: ${{ inputs.backend_release_sha }}
          path: release/backend
          token: ${{ secrets.CPTR_CROSS_REPO_TOKEN || github.token }}

      - name: Checkout exact browser extension release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: heidi-dang/chatgpt-chrome-extension
          ref: ${{ inputs.extension_release_sha }}
          path: release/extension
          token: ${{ secrets.CPTR_CROSS_REPO_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: release/plugin/package-lock.json

      - name: Install pinned plugin dependencies
        working-directory: release/plugin
        run: npm ci

      - name: Run evidence-gated Release Guardian
        run: |
          node scripts/release-guardian.mjs \
            --plugin=release/plugin \
            --backend=release/backend \
            --extension=release/extension \
            --plugin-sha="$EXPECTED_PLUGIN_SHA" \
            --backend-sha="$EXPECTED_BACKEND_SHA" \
            --extension-sha="$EXPECTED_EXTENSION_SHA" \
            --output="$RUNNER_TEMP/release-guardian-evidence.json" \
            --require-clean=true

      - name: Preserve Release Guardian evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-guardian-${{ github.run_id }}
          path: ${{ runner.temp }}/release-guardian-evidence.json
          if-no-files-found: warn
          retention-days: 30

  managed-oauth-authenticated-contract:
    name: Managed OAuth authenticated MCP 2026 contract
    needs:
      - public-edge
      - release-guardian
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CPTR_DEPLOYED_MCP_URL: ${{ vars.CPTR_DEPLOYED_MCP_URL }}
      # This must be a short-lived access token obtained through the intended
      # Cloudflare Managed OAuth client flow. It is not an origin bypass token.
      CPTR_DEPLOYED_MCP_TOKEN: ${{ secrets.CPTR_MANAGED_OAUTH_ACCESS_TOKEN }}
      CPTR_EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha }}
      CPTR_EXPECTED_TOOL_SURFACE: compact
    steps:
      - name: Require Cloudflare Managed OAuth mode
        env:
          EDGE_AUTH_MODE: ${{ vars.CPTR_EDGE_AUTH_MODE }}
        run: |
          test "$EDGE_AUTH_MODE" = "cloudflare-managed"

      - name: Require Managed OAuth acceptance credentials and immutable release
        run: |
          test -n "$CPTR_DEPLOYED_MCP_URL"
          test -n "$CPTR_DEPLOYED_MCP_TOKEN"
          printf '%s' "$CPTR_EXPECTED_RELEASE_SHA" | grep -Eq '^[0-9a-f]{40}$'

      - name: Checkout exact release under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_release_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify authenticated MCP through Managed OAuth and exact release SHA
        run: npm run check:deployed-contract

      - name: Record authenticated Managed OAuth acceptance evidence
        if: ${{ success() }}
        run: |
          {
            echo '### Managed OAuth authenticated acceptance'
            echo
            echo "- release: \`$CPTR_EXPECTED_RELEASE_SHA\`"
            echo '- auth path: Cloudflare Managed OAuth client token'
            echo '- MCP contract: passed'
            echo '- expected tool surface: compact'
          } >> "$GITHUB_STEP_SUMMARY"

  manual-managed-release-acceptance:
    name: Manual Managed OAuth exact-SHA release acceptance
    if: ${{ always() }}
    needs:
      - public-edge
      - release-guardian
      - managed-oauth-authenticated-contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all three evidence gates
        env:
          EDGE_AUTH_MODE: ${{ vars.CPTR_EDGE_AUTH_MODE }}
          PUBLIC_RESULT: ${{ needs['public-edge'].result }}
          GUARDIAN_RESULT: ${{ needs['release-guardian'].result }}
          AUTH_RESULT: ${{ needs['managed-oauth-authenticated-contract'].result }}
        run: |
          test "$EDGE_AUTH_MODE" = "cloudflare-managed"
          test "$PUBLIC_RESULT" = "success"
          test "$GUARDIAN_RESULT" = "success"
          test "$AUTH_RESULT" = "success"

      - name: Record authenticated release acceptance
        run: |
          {
            echo '### Managed OAuth authenticated exact-SHA release acceptance'
            echo
            echo "- plugin: ${{ inputs.expected_release_sha }}"
            echo "- backend: ${{ inputs.backend_release_sha }}"
            echo "- extension: ${{ inputs.extension_release_sha }}"
            echo '- public edge: passed'
            echo '- Release Guardian: passed'
            echo '- Managed OAuth authenticated MCP 2026 contract: passed'
          } >> "$GITHUB_STEP_SUMMARY"
